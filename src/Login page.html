<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - Reen Bank</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./output.css" />
  </head>

  <body class="min-h-screen bg-[#d8f5eb]">
    <!-- =========================
       LOGIN PAGE
  ========================== -->

    <main class="min-h-screen relative overflow-hidden">
      <!-- =========================
         MAIN CONTENT
    ========================== -->

      <div
        class="relative z-10 min-h-screen max-w-7xl mx-auto px-8 lg:px-14 py-10 flex items-center"
      >
        <div
          class="w-full grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-24 items-center"
        >
          <!-- =========================
             LEFT SIDE
        ========================== -->

          <div class="text-gray-800">
            <!-- LOGO -->

            <a href="Landing page.html" class="flex items-center gap-3 mb-14">
              <img class="w-52 h-auto" src="/images/logo.png" alt="Reen Bank" />
            </a>

            <!-- SMALL TITLE -->

            <p class="text-emerald-500 text-base font-medium mb-3">Reen Bank</p>

            <!-- MAIN TITLE -->

            <h1
              class="text-5xl md:text-6xl lg:text-[60px] leading-[1.08] font-semibold max-w-2xl"
            >
              Experience
              <br />

              hassle-free banking
            </h1>

            <!-- DESCRIPTION -->

            <p
              class="text-base lg:text-lg text-gray-600 leading-7 max-w-xl mt-7"
            >
              Experience simple, secure, and stress-free banking. Say goodbye to
              long queues and complex procedures and hello to hassle-free
              banking with Reen Bank.
            </p>

            <!-- =========================
               SOCIAL ICONS
          ========================== -->

            <div class="flex items-center gap-4 mt-14">
              <!-- FACEBOOK -->

              <a
                href="#"
                class="w-9 h-9 rounded-full bg-emerald-500 text-white flex items-center justify-center hover:bg-emerald-600 hover:scale-110 transition"
              >
                <img
                  src="/images/facebook 2.png"
                  alt="Facebook"
                  class="w-5 h-5 object-contain"
                />
              </a>

              <!-- INSTAGRAM -->

              <a
                href="#"
                class="w-9 h-9 rounded-full bg-emerald-500 text-white flex items-center justify-center hover:bg-emerald-600 hover:scale-110 transition"
              >
                <img
                  src="/images/instagram 2.png"
                  alt="Instagram"
                  class="w-5 h-5 object-contain"
                />
              </a>

              <!-- TWITTER -->

              <a
                href="#"
                class="w-9 h-9 rounded-full bg-emerald-500 text-white flex items-center justify-center hover:bg-emerald-600 hover:scale-110 transition"
              >
                <img
                  src="/images/twitter 2.png"
                  alt="Twitter"
                  class="w-5 h-5 object-contain"
                />
              </a>
            </div>
          </div>

          <!-- =========================
             LOGIN FORM
        ========================== -->

          <div class="flex justify-center lg:justify-end">
            <div
              class="bg-white w-full max-w-[430px] rounded-3xl px-10 py-10 shadow-lg"
            >
              <!-- FORM TITLE -->

              <h2 class="text-emerald-500 text-3xl font-semibold mb-8">
                Login
              </h2>

              <!-- LOGIN FORM -->

              <form id="loginForm">
                <!-- =========================
                   EMAIL
              ========================== -->

                <div class="mb-6">
                  <label
                    for="loginEmail"
                    class="block text-base font-medium text-gray-800 mb-2"
                  >
                    Email
                  </label>

                  <div class="relative">
                    <input
                      id="loginEmail"
                      type="email"
                      placeholder="Enter your Email"
                      autocomplete="email"
                      class="w-full h-12 border border-gray-300 rounded-xl px-8 pr-12 text-base text-gray-800 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition"
                    />

                    <!-- EMAIL ICON -->

                    <span
                      class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"
                    >
                      <img
                        src="/images/fi-rr-envelope.png"
                        alt="Email"
                        class="w-5 h-5 object-contain"
                      />
                    </span>
                  </div>
                </div>

                <!-- =========================
                   PASSWORD
              ========================== -->

                <div class="mb-6">
                  <label
                    for="loginPassword"
                    class="block text-base font-medium text-gray-800 mb-2"
                  >
                    Password
                  </label>

                  <div class="relative">
                    <input
                      id="loginPassword"
                      type="password"
                      placeholder="Enter your Password"
                      autocomplete="current-password"
                      class="w-full h-12 border border-gray-300 rounded-xl px-4 pr-12 text-base text-gray-800 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 transition"
                    />

                    <!-- PASSWORD ICON -->

                    <span
                      class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"
                    >
                      <img
                        src="/images/fi-rr-lock.png"
                        alt="Password"
                        class="w-5 h-5 object-contain"
                      />
                    </span>
                  </div>
                </div>

                <!-- =========================
                   LOGIN BUTTON
              ========================== -->

                <button
                  type="button"
                  onclick="loginUser()"
                  class="w-full h-12 bg-[#32b98a] hover:bg-[#27a97d] text-white rounded-xl flex items-center justify-center text-base font-semibold transition hover:-translate-y-0.5 hover:shadow-lg"
                >
                  Login
                </button>

                <!-- =========================
                   REGISTER LINK
              ========================== -->

                <p class="text-sm text-gray-400 mt-6">
                  Don't have an account?

                  <a
                    href="Register page.html"
                    class="text-emerald-500 font-medium hover:text-emerald-600"
                  >
                    Register.
                  </a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- =========================
       JAVASCRIPT
  ========================== -->

    <script src="./script.js"></script>

    <script src="./Logins.js"></script>
  </body>
</html>
